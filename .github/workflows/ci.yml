name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy scipy rasterio scikit-learn scikit-image pytest
      # data-free tests only: the competition rasters are gitignored mirrors (IR-67-DATA-01)
      - run: python -m pytest -q tests
      - run: python -c "import json,glob;[json.load(open(p)) for p in glob.glob('registry/*.json')+glob.glob('docs/data/*.json')]"
